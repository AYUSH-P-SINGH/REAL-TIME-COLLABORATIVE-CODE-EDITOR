events {
    worker_connections 4096;
}

http {
    # Logging configuration with Request ID tracking
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_request_id"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # -------------------------------------------------------------
    # 1. CONTROL PLANE: Stateless REST API Cluster (Least Connections)
    # -------------------------------------------------------------
    upstream rest_control_plane {
        least_conn;
        server backend-1:5000 max_fails=3 fail_timeout=10s;
        server backend-2:5000 max_fails=3 fail_timeout=10s;
        server backend-3:5000 max_fails=3 fail_timeout=10s;
    }

    # -------------------------------------------------------------
    # 2. DATA PLANE: Stateful Sync Nodes (Consistent Hashing on docId)
    # Shards collaborative rooms across sync nodes using Ketama consistent
    # hashing with virtual nodes. Eliminates unnecessary inter-node fanout.
    # -------------------------------------------------------------
    upstream sync_data_plane {
        hash $arg_docId consistent;
        server backend-1:5000 max_fails=3 fail_timeout=10s;
        server backend-2:5000 max_fails=3 fail_timeout=10s;
        server backend-3:5000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 5000;
        server_name localhost;

        # WebSocket Data Plane: Consistent Hashing by docId
        location /socket.io/ {
            proxy_pass http://sync_data_plane;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $http_x_request_id;

            # Extended timeouts for persistent WebSocket streams
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # Control Plane: REST API routes (Stateless)
        location /api/ {
            proxy_pass http://rest_control_plane;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $http_x_request_id;
        }

        # OpenAPI Interactive Documentation
        location /api-docs {
            proxy_pass http://rest_control_plane;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Prometheus metrics scraping
        location /metrics {
            proxy_pass http://rest_control_plane;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Liveness & readiness health checks
        location /health {
            proxy_pass http://rest_control_plane;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
