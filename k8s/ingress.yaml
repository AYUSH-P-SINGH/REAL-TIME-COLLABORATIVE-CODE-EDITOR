apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codesync-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    nginx.ingress.kubernetes.io/websocket-services: "codesync-backend-service"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$arg_docId"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  rules:
    - host: api.codesync.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: codesync-backend-service
                port:
                  number: 5000
