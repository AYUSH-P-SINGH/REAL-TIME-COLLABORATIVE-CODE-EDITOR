version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - collab-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/collab-db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=supersecretjwtkeythatisatleast32characterslong
      - JWT_EXPIRES_IN=7d
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - collab-net
    restart: unless-stopped

  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - collab-net
    restart: unless-stopped

  redis:
    image: redis:7.0-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - collab-net
    restart: unless-stopped

networks:
  collab-net:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
