version: '3.8'

services:
  # Nginx Reverse Proxy & Load Balancer (Single Unified Entrypoint)
  nginx-lb:
    image: nginx:alpine
    ports:
      - "5000:5000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    networks:
      - collab-net
    restart: unless-stopped

  # Stateless Backend Node Instance 1
  backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=5000
      - INSTANCE_ID=node-1
      - MONGO_URI=mongodb://mongo:27017/collab-db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=supersecretjwtkeythatisatleast32characterslong
      - JWT_EXPIRES_IN=7d
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:5000
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - collab-net
    restart: unless-stopped

  # Stateless Backend Node Instance 2
  backend-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=5000
      - INSTANCE_ID=node-2
      - MONGO_URI=mongodb://mongo:27017/collab-db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=supersecretjwtkeythatisatleast32characterslong
      - JWT_EXPIRES_IN=7d
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:5000
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - collab-net
    restart: unless-stopped

  # Stateless Backend Node Instance 3
  backend-3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=5000
      - INSTANCE_ID=node-3
      - MONGO_URI=mongodb://mongo:27017/collab-db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=supersecretjwtkeythatisatleast32characterslong
      - JWT_EXPIRES_IN=7d
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:5000
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - collab-net
    restart: unless-stopped

  # Frontend Client Application (Vite / React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - nginx-lb
    networks:
      - collab-net
    restart: unless-stopped

  # MongoDB Document Database
  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - collab-net
    restart: unless-stopped

  # Redis Cluster Broker (Pub/Sub, Redis Streams WAL & Distributed Caching)
  redis:
    image: redis:7.0-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - collab-net
    restart: unless-stopped

networks:
  collab-net:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
