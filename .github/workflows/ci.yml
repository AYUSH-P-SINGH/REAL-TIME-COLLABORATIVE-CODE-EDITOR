name: CodeSync CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Lint Backend
        run: |
          cd backend
          npm ci
          npm run lint

      - name: Lint Frontend
        run: |
          cd frontend
          npm ci
          npm run lint

  test-backend:
    name: Backend Tests & CRDT Convergence
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
      redis:
        image: redis:7.0-alpine
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Test Suite (CRDT Convergence, WAL Durability, Execution Engine)
        run: |
          cd backend
          npm test
        env:
          NODE_ENV: test
          PORT: 5000
          MONGO_URI: mongodb://localhost:27017/collab-test-db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: supersecretcijwtkeythatisover32characterslong12345
          JWT_EXPIRES_IN: 1d

      - name: Run Latency Benchmark Harness
        run: |
          cd backend
          npm run benchmark
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/collab-test-db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: supersecretcijwtkeythatisover32characterslong12345

  build-frontend:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Production Assets
        run: |
          cd frontend
          npm run build

  docker-compose-check:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
